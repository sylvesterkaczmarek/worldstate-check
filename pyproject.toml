[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldstate-check"
version = "0.1.2"
description = "CLI-first deterministic postcondition verification for AI agents and autonomous systems, with an embeddable Python API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = ["PyYAML>=6.0.2,<7"]
keywords = ["ai-agents", "autonomy", "verification", "assurance", "robotics", "telemetry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sylvesterkaczmarek/worldstate-check"
Repository = "https://github.com/sylvesterkaczmarek/worldstate-check"
Issues = "https://github.com/sylvesterkaczmarek/worldstate-check/issues"

[project.scripts]
worldstate-check = "worldstate_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
